<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9449 Yellowjackets — Tech Binder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <div class="nav-inner">
      <div class="nav-brand">
        <img id="nav-logo" src="" alt="9449 logo" onerror="this.style.display='none'" />
        <div class="nav-brand-text">
          <span class="nav-team-num">9449</span>
          <span class="nav-team-name">YELLOWJACKETS</span>
        </div>
        <div class="nav-divider"></div>
        <span id="nav-season" class="nav-season"></span>
        <span class="nav-binder-label">BINDER</span>
      </div>
      <div class="nav-right"><div class="nav-links" id="nav-links"></div><button id="theme-toggle" aria-label="Toggle theme">☀️</button></div>
    </div>
    <div class="nav-accent-bar"></div>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-bg-pattern"></div>
    <div class="hero-content">
      <p class="hero-pre" id="hero-pre"></p>
      <h1 class="hero-robot" id="hero-robot"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
    <div class="hero-scroll-hint">
      <span>SCROLL</span>
      <div class="hero-scroll-line"></div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main id="main"></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
